<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5"><title>LinkHub</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#171717;--mu:#737373;--bd:#dedede;--ac:#3f3f46;--blue:#2563eb;--bluebg:#dbeafe;--gold:#a16207}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.w{max-width:680px;margin:auto;padding:16px 14px 40px}h1{font-size:23px;margin:0}.sub{color:var(--mu);font-size:13px}.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 1px 2px #00000008}input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:11px;background:#fafafa;font:inherit;margin:5px 0;outline:0}input:focus{border-color:#a3a3a3}button{background:var(--ac);color:#fff;border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}button.g{background:#fff;color:var(--ac);border:1px solid var(--bd)}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:#e5e7eb;color:#525252}.tag.cr{background:var(--bluebg);color:#1d4ed8}.tag.pr{background:#fef3c7;color:var(--gold)}.tick{display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;line-height:16px;text-align:center;font-weight:800}.av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;background-size:cover;background-position:center}.av.big{width:64px;height:64px;font-size:28px}.l a{color:#171717;word-break:break-all;font-weight:750;text-decoration:none}.l a:hover{text-decoration:underline}.msg{font-size:13px;color:#a16207}.danger{color:#b91c1c}.tiny{font-size:12px}.viewer{padding:8px 0;border-top:1px solid var(--bd)}.empty{padding:12px 0;color:var(--mu)}
</style></head><body><div class="w">
<div class="row sp"><div><h1>🔗 LinkHub</h1><div class="sub">Publish a link. Everyone can open it.</div></div><div id="me"></div></div>
<div id="app"><div class="c sub">Loading…</div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// Add your Firebase web config here. See README.md.
const FIREBASE_CONFIG={apiKey:"AIzaSyCw3ggyhDMB-_-SrvYczLq8K-sq3Cd6fq0",authDomain:"linkhub-d2b3b.firebaseapp.com",projectId:"linkhub-d2b3b",storageBucket:"linkhub-d2b3b.firebasestorage.app",messagingSenderId:"325123172175",appId:"1:325123172175:web:156086f6fc53f48167473a"};const FIREBASE_CONFIG={apiKey:"",authDomain:"",projectId:"",appId:""};
const APP_SHARE_URL="";
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,uid,links=[],profiles={},creatorUid=null,tab='feed';
const HOUR=3600000,LIMIT=3;
const COLORS=['#6b7280','#475569','#78716c','#64748b','#52525b','#57534e','#737373','#4b5563'];
const me=()=>profiles[uid]||{},isCr=id=>id&&id===creatorUid,isPrem=()=>isCr(uid)||!!me().premium;
const recentCount=()=>links.filter(l=>l.authorId===uid&&Date.now()-Number(l.createdAt||0)<HOUR).length;
const col=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
function avatar(id,name,big){const p=profiles[id]||{},ok=isCr(id)||p.premium,ph=ok&&p.photo;return `<div class="av${big?' big':''}" style="${ph?`background-image:url(${ph})`:`background-color:${col(id)}`}" title="${esc(name||'User')}">${ph?'':esc((name||'?').trim().charAt(0).toUpperCase())}</div>`}
function badge(id){const p=profiles[id]||{};if(isCr(id))return ' <span class="tag cr">CREATOR</span> <span class="tick">✓</span>';return (p.premium?' <span class="tag pr">PREMIUM</span>':' <span class="tag">USER</span>')+(p.premium&&p.tick?' <span class="tick">✓</span>':'')}
function listHtml(){return links.length?links.map(l=>`<div class="c l"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">${avatar(l.authorId,l.authorName)}<div style="min-width:0;flex:1"><a href="${esc(l.url)}" onclick="openLink('${esc(l.id)}','${esc(l.url)}');return false">${esc(l.title||l.url)}</a><div class="sub">${esc(l.url)}</div><div class="sub"><b>${esc(l.authorName||'User')}</b>${badge(l.authorId)} · ${new Date(Number(l.createdAt)).toLocaleString()}</div></div></div><div class="row" style="margin-top:9px"><button class="g" onclick="openLink('${esc(l.id)}','${esc(l.url)}')">Open</button><button class="g" onclick="shareText('${esc(l.url)}')">Share</button>${(l.authorId===uid||isCr(uid))?`<button class="g" onclick="showViews('${esc(l.id)}')">Viewers</button><button class="g" onclick="del('${esc(l.id)}')">Delete</button>`:''}</div><div id="views-${esc(l.id)}"></div></div>`).join(''):'<div class="c sub">No links yet. Be the first!</div>'}
function render(){if(!uid)return;const p=me(),nm=p.name;if(!nm){$('#me').innerHTML='';$('#app').innerHTML=`<div class="c"><b>Welcome to LinkHub</b><div class="sub">Add your name so everyone can see who published a link and who opened it.</div><input id="nm" maxlength="24" placeholder="Your name"><div class="row sp"><span class="msg" id="m"></span><button onclick="saveName()">Continue</button></div></div>`;return}
$('#me').innerHTML=`<div class="row" style="flex-wrap:nowrap">${avatar(uid,nm)}<div style="text-align:right"><b>${esc(nm)}</b><div>${badge(uid)}</div></div></div>`;
let h=`<div class="row"><button class="${tab==='feed'?'':'g'}" onclick="tab='feed';render()">Links</button><button class="${tab==='acct'?'':'g'}" onclick="tab='acct';render()">Account</button><button class="g" onclick="shareText('Get LinkHub: '+APP_SHARE_URL)">Share app</button></div>`;
if(tab==='acct'){const prem=isPrem();h+=`<div class="c row">${avatar(uid,nm,true)}<div><b>${esc(nm)}</b>${badge(uid)}<div class="sub">Plan: ${isCr(uid)?'Creator':prem?'Premium':'Free'}</div></div></div><div class="c"><b>Change name</b><input id="nm" maxlength="24" value="${esc(nm)}"><div class="row sp"><span class="msg" id="m"></span><button onclick="saveName()">Save</button></div></div>`;
if(prem){h+=`<div class="c"><b>Profile picture</b><div class="sub">Premium users can choose a gallery photo.</div><div class="row" style="margin-top:8px"><button onclick="pickPhoto()">Choose from gallery</button>${p.photo?'<button class="g" onclick="rmPhoto()">Use letter</button>':''}</div><input id="ph" type="file" accept="image/*" style="display:none" onchange="gotPhoto(this)"><span class="msg" id="m2"></span></div>`;if(!isCr(uid))h+=`<div class="c row sp"><div><b>Blue tick</b><div class="sub">Premium verification badge</div></div><button onclick="toggleTick()">${p.tick?'Remove ✓':'Get ✓'}</button></div>`}
else h+=`<div class="c"><b>Upgrade to Premium</b><div class="sub">Use a Creator Code to unlock unlimited links, blue tick and profile photo.</div><input id="cc" placeholder="Creator Code" autocapitalize="off"><div class="row sp"><span class="msg" id="m"></span><button onclick="upgrade()">Upgrade</button></div></div>`;
}else{const left=Math.max(0,LIMIT-recentCount()),prem=isPrem();h+=`<div class="c"><b>Publish a link</b><div class="sub">${prem?'Premium: unlimited links.':`Free: ${left} of ${LIMIT} links remaining this hour.`}</div><input id="t" maxlength="80" placeholder="Title (optional)"><input id="u" placeholder="https://…" inputmode="url" autocapitalize="off"><div class="row sp"><span class="msg" id="m"></span><button id="pb" onclick="publish()">Publish</button></div></div><div id="list">${listHtml()}</div>`}
$('#app').innerHTML=h}
const say=(t,id='m')=>{const m=document.getElementById(id);if(m)m.textContent=t};const setP=o=>db.collection('profiles').doc(uid).set({...me(),...o});
async function saveName(){const n=($('#nm')?.value||'').trim();if(!n)return say('Enter a name.');try{await setP({name:n});say('Saved.')}catch(e){say('Error: '+e.code)}}
async function publish(){let u=$('#u').value.trim(),t=$('#t').value.trim();if(!u)return say('Paste a link first.');if(!/^https?:\/\//i.test(u))u='https://'+u;try{new URL(u)}catch(e){return say('Invalid link.')}if(!isPrem()&&recentCount()>=LIMIT)return say('Free limit reached: 3 links per hour. Upgrade to Premium.');const b=$('#pb');b.disabled=true;try{await db.collection('links').add({url:u,title:t,authorId:uid,authorName:me().name,createdAt:Date.now()});$('#u').value='';$('#t').value='';say('Published ✓')}catch(e){say('Could not publish: '+e.code)}b.disabled=false}
async function openLink(id,url){try{await db.collection('links').doc(id).collection('views').add({viewerId:uid,viewerName:me().name||'User',openedAt:Date.now()})}catch(e){}window.location.href=url}
async function showViews(id){const box=$('#views-'+id);if(!box)return;box.innerHTML='<div class="sub">Loading viewers…</div>';try{let s=await db.collection('links').doc(id).collection('views').limit(100).get();let a=s.docs.map(d=>d.data()).sort((x,y)=>Number(y.openedAt)-Number(x.openedAt));box.innerHTML='<div class="c" style="margin-top:8px"><b>Who opened this</b>'+ (a.length?a.map(v=>`<div class="viewer"><b>${esc(v.viewerName||'User')}</b><span class="sub"> · ${new Date(Number(v.openedAt)).toLocaleString()}</span></div>`).join(''):'<div class="empty">No recorded opens yet.</div>')+'</div>'}catch(e){box.innerHTML='<div class="msg">Could not load viewers.</div>'}}
async function del(id){if(confirm('Delete this link?'))try{await db.collection('links').doc(id).delete()}catch(e){alert('Could not delete')}}
async function upgrade(){const c=$('#cc').value.trim();if(!c)return say('Enter the Creator Code.');try{const snap=await db.collection('codes').doc(c).get();if(!snap.exists)return say('Wrong Creator Code.');await setP({premium:true,code:c});say('Premium activated ✓')}catch(e){say('Could not upgrade: '+e.code)}}
const toggleTick=()=>setP({tick:!me().tick});
function pickPhoto(){if(confirm('Allow LinkHub to access your gallery to choose a profile picture?'))$('#ph').click()}
function gotPhoto(inp){const f=inp.files[0];if(!f)return;const img=new Image(),url=URL.createObjectURL(f);img.onload=async()=>{const s=96,cv=document.createElement('canvas');cv.width=cv.height=s;const m=Math.min(img.width,img.height);cv.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);URL.revokeObjectURL(url);try{await setP({photo:cv.toDataURL('image/jpeg',.75)})}catch(e){say('Could not save photo','m2')}};img.onerror=()=>say('Not an image.','m2');img.src=url}
async function rmPhoto(){await setP({photo:firebase.firestore.FieldValue.delete()})}
function shareText(t){if(window.Android?.share)return Android.share(t);if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('Copied'))}
try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();firebase.auth().onAuthStateChanged(u=>{if(!u)return;uid=u.uid;db.collection('links').orderBy('createdAt','desc').limit(200).onSnapshot(s=>{links=s.docs.map(d=>({id:d.id,...d.data()}));render()});db.collection('profiles').onSnapshot(s=>{profiles={};s.docs.forEach(d=>profiles[d.id]=d.data());render()});db.collection('config').doc('creator').onSnapshot(s=>{creatorUid=s.exists?s.data().uid:null;render()});render()});firebase.auth().signInAnonymously().catch(e=>$('#app').innerHTML='<div class="c">Sign-in failed: '+esc(e.code)+'</div>')}catch(e){$('#app').innerHTML='<div class="c">Firebase is not configured yet. Add your Firebase config in index.html.</div>'}
</script></body></html>
